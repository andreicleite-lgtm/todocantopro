<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo Canto Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#E1662E;--orange-dark:#C25320;--orange-soft:#FBE7DA;
  --blue:#1E4258;--blue-dark:#152F40;--blue-soft:#DCEAF0;
  --green:#5E7C60;--green-dark:#4A6650;--green-soft:#E4EDE3;
  --yellow:#F2A81D;--yellow-soft:#FDEFCF;
  --ink:#16263B;--ink2:#2A3B52;--paper:#F6EFE4;--paper2:#EFE6D6;
  --ok:#4A6650;--ok-bg:#E4EDE3;--warn:#B26A00;--warn-bg:#FFF3DD;--danger:#B5483F;--danger-bg:#FBE4E1;
  --n900:#16263B;--n700:#3A4358;--n500:#6B7488;--n300:#C3CAD6;--n200:#E0E5EC;--n100:#EFF2F6;--n50:#F7F9FB;--white:#fff;
  --radius:20px;--radius-sm:13px;
  --shadow-sm:0 1px 2px rgba(22,38,59,.04),0 3px 10px rgba(22,38,59,.05);
  --shadow-md:0 6px 16px rgba(22,38,59,.07),0 14px 36px rgba(22,38,59,.09);
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif;background:var(--paper);color:var(--n700);-webkit-font-smoothing:antialiased;}
.serif{font-family:'Fraunces',serif;}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* layout */
.app{display:flex;min-height:100vh;}
.side{width:236px;min-width:236px;background:var(--white);border-right:1px solid var(--n100);padding:18px 13px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 18px;}
.brand .mark-img{height:38px;width:auto;object-fit:contain;}
.brand .name{display:none;}
.cv .cvlogo{height:82px;margin-bottom:14px;padding:0;border-radius:0;}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:none;background:none;padding:11px 12px;border-radius:12px;font-size:14px;font-weight:600;color:var(--n700);margin-bottom:3px;transition:.16s ease;}
.nav button:hover{background:var(--paper);color:var(--ink);}
.nav button.on{background:linear-gradient(120deg,var(--orange-soft),#fff);color:var(--orange-dark);}
.nav .ico{width:20px;text-align:center;font-size:15px;opacity:.9;}
.side .side-foot{margin-top:auto;font-size:11px;color:var(--n500);padding:10px 8px;line-height:1.6;}
.main{flex:1;min-width:0;}
.topbar{height:58px;border-bottom:1px solid var(--n100);background:var(--white);display:flex;align-items:center;padding:0 24px;gap:12px;}
.content{padding:26px 32px 80px;}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;}
.page-head h1{font-family:'Fraunces',serif;font-weight:600;font-size:27px;color:var(--ink);margin:0;letter-spacing:-.01em;}
.page-head p{margin:4px 0 0;color:var(--n500);font-size:14px;}

/* hero de boas-vindas (dashboard) */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:26px 28px;margin-bottom:22px;background:linear-gradient(120deg,#16263B 0%,#1E4258 60%,#2C5A6E 100%);color:#fff;box-shadow:var(--shadow-md);}
.hero .plane{position:absolute;right:2px;top:-18px;font-size:140px;opacity:.09;transform:rotate(12deg);pointer-events:none;}
.hero .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow);font-weight:700;margin-bottom:6px;}
.hero h1{font-family:'Fraunces',serif;font-size:29px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:0 0 6px;color:#fff;}
.hero h1 em{font-style:italic;color:#FCD9B4;}
.hero p{color:rgba(255,255,255,.82);font-size:14px;max-width:460px;margin:0;}
.hero .cta{position:relative;z-index:2;display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
.btn.glass{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.22);}
.btn.glass:hover{background:rgba(255,255,255,.24);}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 18px;border-radius:12px;font-weight:700;font-size:14px;border:none;background:linear-gradient(135deg,var(--orange),#EC8A4A);color:#fff;transition:.16s ease;box-shadow:0 4px 12px rgba(225,102,46,.28);}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(225,102,46,.36);}
.btn.ink{background:var(--ink);box-shadow:none;}.btn.ink:hover{background:var(--ink2);}
.btn.blue{background:var(--blue);box-shadow:none;}.btn.blue:hover{background:var(--blue-dark);}
.btn.ghost{background:var(--white);border:1.5px solid var(--n200);color:var(--n700);box-shadow:none;}
.btn.ghost:hover{border-color:var(--orange);color:var(--orange-dark);transform:none;}
.btn.sm{height:34px;padding:0 13px;font-size:13px;border-radius:9px;}
.btn.danger{background:var(--danger);box-shadow:none;}

/* cards / forms */
.card{background:var(--white);border:1px solid var(--n100);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
.card.pad{padding:22px;}
.grid{display:grid;gap:16px;}
.g2{grid-template-columns:1fr 1fr;}.g3{grid-template-columns:1fr 1fr 1fr;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:12px;font-weight:600;color:var(--n700);}
.field input,.field select,.field textarea{height:42px;border:1.5px solid var(--n200);border-radius:11px;padding:0 12px;font-size:14px;color:var(--n900);background:#fff;min-width:0;width:100%;}
.grid > .field{min-width:0;}
.field textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(225,102,46,.15);}
.row-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;}

/* grid cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
.tile{background:var(--white);border:1px solid var(--n100);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);transition:.2s ease;}
.tile:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);}
.tile .thumb{aspect-ratio:16/10;background:linear-gradient(135deg,var(--green-soft),var(--blue-soft));background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:var(--green);font-size:26px;}
.tile .body{padding:14px;}
.tile h3{font-family:'Fraunces',serif;font-size:17px;color:var(--ink);margin:0 0 4px;}
.tile p{margin:0;font-size:13px;color:var(--n500);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

/* table */
table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--n500);padding:10px 12px;border-bottom:1px solid var(--n100);}
td{padding:12px;border-bottom:1px solid var(--n50);}
tr:last-child td{border-bottom:none;}
tbody tr{transition:.14s ease;}
tbody tr:hover{background:var(--paper);}

/* stats coloridos */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.stat{background:var(--white);border:1px solid var(--n100);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:.2s ease;}
.stat:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);}
.stat .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;margin-bottom:12px;background:var(--orange-soft);color:var(--orange-dark);}
.stat.b .ic{background:var(--green-soft);color:var(--green-dark);}
.stat.c .ic{background:var(--blue-soft);color:var(--blue);}
.stat.d .ic{background:var(--yellow-soft);color:var(--warn);}
.stat .lab{font-size:12.5px;font-weight:600;color:var(--n500);margin-top:5px;}
.stat .val{font-family:'Fraunces',serif;font-size:30px;color:var(--ink);margin-top:2px;line-height:1;}

/* pills */
.pill{display:inline-block;font-size:11px;font-weight:700;padding:4px 11px;border-radius:999px;}
.pill.neutral{background:var(--n100);color:var(--n700);}
.pill.ok{background:var(--ok-bg);color:var(--ok);}
.pill.warn{background:var(--warn-bg);color:var(--warn);}
.pill.blue{background:var(--blue-soft);color:var(--blue);}
.pill.orange{background:var(--orange-soft);color:var(--orange-dark);}
.pill.green{background:var(--green-soft);color:var(--green-dark);}

.empty{border:1.5px dashed var(--n300);border-radius:var(--radius);background:var(--white);padding:46px;text-align:center;}
.empty h3{font-family:'Fraunces',serif;color:var(--ink);margin:0 0 6px;}
.empty p{color:var(--n500);margin:0 0 16px;}

.search{height:40px;border:1.5px solid var(--n200);border-radius:11px;padding:0 12px;font-size:14px;width:260px;max-width:100%;}

.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;}
.thumbs .ph{position:relative;aspect-ratio:4/3;border-radius:8px;overflow:hidden;border:1px solid var(--n200);background-size:cover;background-position:center;background-color:var(--n100);}
.thumbs .ph .rm{position:absolute;top:3px;right:3px;background:var(--danger);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:1;display:none;}
.thumbs .ph:hover .rm{display:block;}
.thumbs .add{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;border:1.5px dashed var(--n300);border-radius:8px;background:var(--n50);color:var(--n500);font-size:12px;flex-direction:column;gap:3px;}

/* toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:90;}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(22,38,59,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:80;overflow-y:auto;}
.modal-bg.show{display:flex;}
.modal{background:#fff;border-radius:22px;width:100%;max-width:620px;box-shadow:0 24px 70px rgba(0,0,0,.32);}
.modal .mhead{padding:18px 22px;border-bottom:1px solid var(--n100);display:flex;justify-content:space-between;align-items:center;}
.modal .mhead h2{font-family:'Fraunces',serif;font-size:20px;color:var(--ink);margin:0;}
.modal .mbody{padding:22px;}
.x{border:none;background:none;font-size:22px;color:var(--n500);line-height:1;}

/* mobile */
.menu-btn{display:none;border:none;background:none;font-size:22px;}
@media(max-width:860px){
  .side{display:none;position:fixed;z-index:70;box-shadow:6px 0 30px rgba(0,0,0,.2);}
  .side.open{display:block;}
  .menu-btn{display:block;}
  .g2,.g3{grid-template-columns:1fr;}
  .stats{grid-template-columns:1fr 1fr;}
  .content{padding:18px;}
}

/* ===== Proposta / impressão premium ===== */
.proposta{max-width:820px;margin:0 auto;}
.cv{position:relative;border-radius:16px;overflow:hidden;color:#fff;margin-bottom:18px;}
.cv .bg{aspect-ratio:16/9;background-size:cover;background-position:center;background-color:var(--ink);}
.cv .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(22,38,59,.85),rgba(22,38,59,.15));}
.cv .txt{position:absolute;left:28px;right:28px;bottom:24px;}
.cv .txt h1{font-family:'Fraunces',serif;font-size:34px;margin:0;color:#fff;}
.cv .bar{height:5px;width:74px;background:var(--orange);margin:8px 0;}
.cv .sub{color:var(--yellow);font-size:15px;}
.cv .cli{margin-top:12px;font-size:13px;opacity:.85;}
.cv .cli b{font-size:19px;font-weight:700;color:#fff;opacity:1;font-family:'Fraunces',serif;}
.sec{margin-bottom:16px;}
.sec h2{font-family:'Fraunces',serif;color:var(--orange);font-size:19px;margin:0 0 10px;padding-left:12px;border-left:4px solid var(--yellow);}
.sec p{line-height:1.65;color:var(--n700);margin:0 0 8px;}
.proposta .sec{position:relative;}
.li{padding:6px 0;border-bottom:1px dashed var(--n100);}
.cron .d{display:flex;gap:12px;margin-bottom:12px;}
.cron .dn{flex-shrink:0;height:fit-content;background:var(--blue);color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;}
.cron .dt{font-weight:600;color:var(--ink);margin:0;}
.inv{border-left:4px solid var(--orange);background:var(--paper);border-radius:10px;padding:18px;}
.inv .pp{font-family:'Fraunces',serif;font-size:30px;color:var(--ink);}
.li{display:flex;gap:8px;margin-bottom:5px;color:var(--n700);font-size:14px;}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.gal .gi{aspect-ratio:4/3;border-radius:8px;background-size:cover;background-position:center;background-color:var(--n100);}
.foot{border-top:1px solid var(--n200);padding-top:14px;margin-top:6px;}
.foot .fb{font-family:'Fraunces',serif;color:var(--orange);font-size:16px;font-weight:600;}
.foot .fl{font-size:12px;color:var(--n500);margin-top:3px;}

/* força impressão colorida (capa, fotos e fundos) */
*{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
@page{ margin:12mm; }
@media print{
  .side,.topbar,.no-print{display:none!important;}
  .content{padding:0;}
  body{background:#fff;}
  .proposta{max-width:100%;}
  .card{box-shadow:none;}
  /* capa preenchida ocupando o topo da 1a página */
  .cv{ break-inside:avoid; }
  .cv .bg{ aspect-ratio:auto; height:320px; }
  .card.pad.sec{ break-inside:avoid; }
  /* cada bloco com leve cor de fundo pra não ficar "branco demais" */
  .sec{ background:var(--n50); border-radius:12px; }
}

.funil-col.drag-over{background:#E9732415;outline:2px dashed #E97324;}
.funil-card:active{cursor:grabbing;}
.funil-board::-webkit-scrollbar{height:8px;}
.funil-board::-webkit-scrollbar-thumb{background:var(--n300);border-radius:4px;}
</style>
</head>
<body>
<div id="gate" style="position:fixed;inset:0;z-index:200;background:linear-gradient(135deg,var(--ink),var(--blue-dark));display:flex;align-items:center;justify-content:center;padding:20px">
  <div style="background:#fff;border-radius:18px;padding:34px 28px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center">
    <img src="" id="gateLogo" alt="Todo Canto" style="height:64px;margin-bottom:14px">
    <h2 style="font-family:'Fraunces',serif;color:var(--ink);margin:0 0 4px;font-size:22px">Todo Canto Pro</h2>
    <p style="color:var(--n500);font-size:14px;margin:0 0 20px">Acesso restrito à equipe</p>
    <input type="password" id="senhaInput" placeholder="Senha da equipe" style="width:100%;height:46px;border:1.5px solid var(--n300);border-radius:10px;padding:0 14px;font-size:15px;text-align:center;margin-bottom:10px">
    <div id="senhaErro" style="display:none;color:var(--danger);font-size:13px;margin-bottom:10px">Senha incorreta. Tente de novo.</div>
    <button onclick="tentarEntrar()" style="width:100%;height:46px;border:none;border-radius:10px;background:var(--orange);color:#fff;font-weight:700;font-size:15px;cursor:pointer">Entrar</button>
  </div>
</div>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><img class="mark-img" id="brandLogo" alt="Todo Canto"></div>
    <nav class="nav" id="nav">
      <button data-page="dashboard" class="on"><span class="ico">▥</span> Dashboard</button>
      <button data-page="clientes"><span class="ico">☺</span> Clientes</button>
      <button data-page="destinos"><span class="ico">⚲</span> Destinos</button>
      <button data-page="hoteis"><span class="ico">⌂</span> Hotéis</button>
      <button data-page="biblioteca"><span class="ico">▦</span> Biblioteca</button>
      <button data-page="extras"><span class="ico">✚</span> Extras</button>
      <button data-page="propostas"><span class="ico">✦</span> Propostas</button>
      <button data-page="comparativos"><span class="ico">⇄</span> Comparativos</button>
    </nav>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
      <strong class="serif" style="color:var(--ink)">Todo Canto Pro</strong>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal"><div class="mhead"><h2 id="modalTitle"></h2><button class="x" onclick="closeModal()">×</button></div><div class="mbody" id="modalBody"></div></div></div>
<div class="modal-bg" id="modalBg2" style="z-index:120"><div class="modal"><div class="mhead"><h2 id="modalTitle2"></h2><button class="x" onclick="closeModal2()">×</button></div><div class="mbody" id="modalBody2"></div></div></div>
<div class="toast" id="toast"></div>

// Carrega tudo do banco central ao abrir
async function loadAll(){
  const [c,d,h,e,p,a] = await Promise.all([
    sb.from('clientes').select('*').order('created_at',{ascending:false}),
    sb.from('destinos').select('*, biblioteca_midia(*)').order('nome'),
    sb.from('hoteis').select('*, biblioteca_midia(*)').order('nome'),
    sb.from('extras').select('*').order('created_at',{ascending:false}),
    sb.from('propostas').select('*').order('created_at',{ascending:false}),
    sb.from('aereos').select('*').order('created_at',{ascending:false}),
  ]);
  try{ const cp=await sb.from('comparativos').select('*').order('created_at',{ascending:false}); comparativos=(cp.data||[]).map(mapComparativo); }catch(e){ comparativos=[]; }
  clientes = (c.data||[]).map(mapCliente);
  destinos = (d.data||[]).map(mapDestino);
  hoteis   = (h.data||[]).map(mapHotel);
  extras   = (e.data||[]).map(mapExtra);
  propostas= (p.data||[]).map(mapProposta);
  aereos   = (a.data||[]).map(mapAereo);
}

// Conversores: banco (snake) -> app (camel)
function mapComparativo(r){ return { id:r.id, numero:r.numero, clienteId:r.cliente_id, consultor:r.consultor, titulo:r.titulo, opcoes:r.opcoes||[], observacoes:r.observacoes, criadoEm:r.created_at }; }
function mapCliente(r){ return { id:r.id, nome:r.nome, telefone:r.telefone, email:r.email, empresa:r.empresa_ou_escola, origem:r.origem||'', obs:r.observacoes }; }
function mapDestino(r){ const fotos=(r.biblioteca_midia||[]).filter(m=>m.categoria==='destino').sort((a,b)=>a.ordem-b.ordem).map(m=>m.url); return { id:r.id, nome:r.nome, descricao:r.descricao, roteiro:r.roteiro_padrao, diferenciais:r.diferenciais, fotos, capa:r.capa_url||fotos[0]||'' }; }
function mapHotel(r){ const fotos=(r.biblioteca_midia||[]).filter(m=>m.categoria==='hotel').sort((a,b)=>a.ordem-b.ordem).map(m=>m.url); return { id:r.id, nome:r.nome, categoria:r.categoria, destinoId:r.destino_id, descricao:r.descricao, valor:Number(r.valor)||0, tipoQuarto:r.tipo_quarto||'', ocupacao:Number(r.ocupacao)||2, tiposQuarto:r.tipos_quarto||[], inclui:r.inclui||'', estrelas:Number(r.estrelas)||0, moeda:r.moeda||'BRL', fotos, capa:r.capa_url||fotos[0]||'' }; }
function mapExtra(r){ return { id:r.id, nome:r.nome, tipo:r.tipo, destinoId:r.destino_id, moeda:r.moeda, valor:Number(r.valor)||0, valorCriancaColo:Number(r.valor_crianca_colo)||0, valorCrianca:Number(r.valor_crianca)||0, descricao:r.descricao }; }

const moneySym = {BRL:'R$',USD:'US$',EUR:'€'};
function fmtMoeda(v,m='BRL'){ return moneySym[m]+' '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtData(d){ if(!d) return '—'; const [y,mo,da]=d.split('-'); return da+'/'+mo+'/'+y; }
function periodo(a,b){ if(!a&&!b)return '—'; if(a&&b)return fmtData(a)+' a '+fmtData(b); return fmtData(a||b); }
function dias(a,b){ if(!a||!b)return 0; return Math.max(0,Math.round((new Date(b)-new Date(a))/864e5)); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fileToDataURL(file){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(file); }); }

function lerOpcoesCmp(){
  return Array.from(document.querySelectorAll('#cmp_opcoes .cmp-opcao')).map((el,i)=>{

    const d=destinos.find(x=>x.id===destId);
    return { destinoId:destId, destinoNome:d?d.nome:'', resumo:el.querySelector('.cmp-resumo').value.trim(), valor:+el.querySelector('.cmp-valor').value||0, moeda:'BRL', foto:_cmpOpcoes[i]?_cmpOpcoes[i].foto:'' };
  });

function addOpcaoCmp(){ _cmpOpcoes=lerOpcoesCmp(); _cmpOpcoes.push({destinoId:'',resumo:'',valor:0,moeda:'BRL',foto:''}); document.getElementById('cmp_opcoes').innerHTML=_cmpOpcoes.map((o,i)=>opcaoCmpHTML(o,i)).join(''); }
function rmOpcaoCmp(i){ _cmpOpcoes=lerOpcoesCmp(); _cmpOpcoes.splice(i,1); if(!_cmpOpcoes.length)_cmpOpcoes=[{destinoId:'',resumo:'',valor:0,moeda:'BRL',foto:''}]; document.getElementById('cmp_opcoes').innerHTML=_cmpOpcoes.map((o,i)=>opcaoCmpHTML(o,i)).join(''); }

async function uploadFotoCmp(input){
  const idx=+input.dataset.idx; const file=input.files[0]; if(!file)return;
  _cmpOpcoes=lerOpcoesCmp();
  try{
    const path='comparativos/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'-'+file.name.replace(/[^a-zA-Z0-9.]/g,'');
    const up=await sb.storage.from('midia').upload(path,file,{upsert:true});
    if(up.error) throw up.error;
    const { data:pub }=sb.storage.from('midia').getPublicUrl(path);
    _cmpOpcoes[idx].foto=pub.publicUrl;
    const prev=document.querySelector('.cmp-foto-prev[data-idx="'+idx+'"]'); if(prev) prev.innerHTML=`<img src="${pub.publicUrl}" style="height:60px;border-radius:8px">`;
    toast('Foto enviada');
  }catch(e){ console.error(e); toast('Erro ao enviar foto'); }
}

async function salvarComparativo(id){
  const clienteId=val('cmp_cli'); if(!clienteId){toast('Escolha o cliente');return;}
  const opcoes=lerOpcoesCmp().filter(o=>o.destinoId||o.resumo||o.valor);
  if(!opcoes.length){toast('Adicione ao menos uma opção');return;}
  const row={ cliente_id:clienteId, consultor:val('cmp_cons'), titulo:val('cmp_tit'), opcoes, observacoes:val('cmp_obs') };
  try{
    if(id){ await sb.from('comparativos').update(row).eq('id',id); }
    else {
      const ano=new Date().getFullYear();
      const seq=(comparativos.filter(c=>(c.numero||'').includes('CMP-'+ano)).length)+1;
      row.numero='CMP-'+ano+'-'+String(seq).padStart(3,'0');
      await sb.from('comparativos').insert(row);
    }
    await loadAll(); closeModal(); toast('Comparativo salvo'); go('comparativos');
  }catch(e){ console.error(e); toast('Erro ao salvar: '+(e.message||e.code||'')); }
}

async function delComparativo(id){
  const c=comparativos.find(x=>x.id===id); const cl=clientes.find(x=>x.id===(c&&c.clienteId));
  if(!confirm('Excluir o comparativo '+(c?.numero||'')+(cl?(' de '+cl.nome):'')+'?'))return;
  try{ await sb.from('comparativos').delete().eq('id',id); await loadAll(); toast('Excluído'); render(); }
  catch(e){ console.error(e); toast('Erro ao excluir'); }
}

  const c=comparativos.find(x=>x.id===cmpId); if(!c)return;

  go('propostas');
  setTimeout(()=>{

      toast('Proposta iniciada com a opção escolhida');
    },120);
  },60);
}

let tmpFotos=[];
function thumbHTML(src,i){ return `<div class="ph" style="background-image:url('${src}')"><button class="rm" onclick="rmFoto(${i})">×</button></div>`; }
async function addFotos(input){
  for(const file of input.files){
    try{
      const ext=(file.name.split('.').pop()||'jpg');
      const path='galeria/'+uid()+'.'+ext;
      const { error }=await sb.storage.from('midia').upload(path, file);
      if(error){ console.error(error); toast('Erro no upload'); continue; }
      const { data }=sb.storage.from('midia').getPublicUrl(path);
      tmpFotos.push(data.publicUrl);
    }catch(e){ console.error(e); toast('Erro no upload'); }
  }
  redrawFotos();
}
function rmFoto(i){ tmpFotos.splice(i,1); redrawFotos(); }
function redrawFotos(){
  const box=document.getElementById('f_fotos'); if(!box)return;
  box.innerHTML = tmpFotos.map((f,i)=>thumbHTML(f,i)).join('') + `<label class="add">+ foto<input type="file" accept="image/*" multiple hidden onchange="addFotos(this)"></label>`;
}
async function saveDestino(id){
  const nome=val('f_nome'); if(!nome){toast('Informe o nome');return;}
  const row={ nome, descricao:val('f_desc'), roteiro_padrao:val('f_rot'), diferenciais:val('f_dif'), capa_url:tmpFotos[0]||null };
  try{
    let destinoId=id;
    if(id){ await sb.from('destinos').update(row).eq('id',id); }
    else { const {data}=await sb.from('destinos').insert(row).select('id').single(); destinoId=data.id; }
    await syncFotos('destino', destinoId, tmpFotos);
    await loadAll(); closeModal(); toast('Destino salvo'); render();
  }catch(e){ console.error(e); toast('Erro ao salvar'); }
}
// Sincroniza as fotos da galeria (apaga as antigas do item e insere as atuais)
async function syncFotos(categoria, ownerId, fotos){
  const col = categoria==='destino' ? 'destino_id' : 'hotel_id';
  await sb.from('biblioteca_midia').delete().eq(col, ownerId);
  if(fotos.length){
    const rows = fotos.map((url,i)=>({ categoria, [col]:ownerId, url, ordem:i }));
    await sb.from('biblioteca_midia').insert(rows);
  }
}

// HTML de um trecho (perna do voo)
function trechoHTML(tipo,t,i){
  return `<div class="trecho" data-tipo="${tipo}" style="border:1.5px solid var(--n200);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--n50)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <span style="font-size:11px;font-weight:700;color:var(--n500)">Trecho ${i+1}</span>
      <button type="button" onclick="rmTrecho(this)" style="border:none;background:none;color:var(--danger);cursor:pointer;font-size:16px">×</button>
    </div>
    <div class="grid g2" style="gap:8px">
      <div class="field" style="margin:0"><label>Origem</label><input class="t-origem" list="listaAeroportos" value="${esc(t.origem||'')}" placeholder="Ex: Fortaleza (FOR)"></div>
      <div class="field" style="margin:0"><label>Destino</label><input class="t-destino" list="listaAeroportos" value="${esc(t.destino||'')}" placeholder="Ex: Guarulhos (GRU)"></div>

      <div class="field" style="margin:0"><label>Partida (data)</label><input type="date" class="t-pdata" value="${t.partidaData||''}"></div>
      <div class="field" style="margin:0"><label>Partida (hora)</label><input class="t-phora" value="${esc(t.partidaHora||'')}" placeholder="08:30"></div>
    </div>
    <div class="grid g3" style="gap:8px;margin-top:8px">
      <div class="field" style="margin:0"><label>Chegada (data)</label><input type="date" class="t-cdata" value="${t.chegadaData||''}"></div>
      <div class="field" style="margin:0"><label>Chegada (hora)</label><input class="t-chora" value="${esc(t.chegadaHora||'')}" placeholder="11:45"></div>
      <div></div>

  </div>`;
}
function addTrecho(tipo){
  const box=document.getElementById(tipo==='ida'?'boxIda':'boxVolta');
  const i=box.querySelectorAll('.trecho').length;
  const div=document.createElement('div'); div.innerHTML=trechoHTML(tipo,{},i);
  box.appendChild(div.firstChild);
}
function rmTrecho(btn){
  const box=btn.closest('#boxIda,#boxVolta'); const trecho=btn.closest('.trecho');
  if(box.querySelectorAll('.trecho').length<=1){ toast('Deixe ao menos 1 trecho'); return; }
  trecho.remove();
}
function lerTrechos(boxId){
  return Array.from(document.querySelectorAll('#'+boxId+' .trecho')).map(el=>({
    origem:el.querySelector('.t-origem').value.trim(),
    destino:el.querySelector('.t-destino').value.trim(),
    voo:el.querySelector('.t-voo').value.trim(),
    partidaData:el.querySelector('.t-pdata').value,
    partidaHora:el.querySelector('.t-phora').value.trim(),
    chegadaData:el.querySelector('.t-cdata').value,
    chegadaHora:el.querySelector('.t-chora').value.trim()
  })).filter(t=>t.origem||t.destino||t.voo);
}
async function saveAereo(id){
  const companhia=val('f_comp'); if(!companhia){toast('Informe a companhia');return;}
  const ida=lerTrechos('boxIda'), volta=lerTrechos('boxVolta');
  // resumo (origem do 1o trecho da ida, destino do ultimo trecho da ida) p/ a listagem
  const origem = ida[0]?.origem || '';
  const destino = ida[ida.length-1]?.destino || '';
  const row={ companhia, classe:val('f_classe'), origem, destino,
    ida_data: ida[0]?.partidaData||null, ida_hora: ida[0]?.partidaHora||'',
    volta_data: volta[0]?.partidaData||null, volta_hora: volta[0]?.partidaHora||'',
    trechos_ida: ida, trechos_volta: volta,
    bagagem:val('f_bag'), destino_id:val('f_destino')||null, moeda:val('f_moeda')||'BRL', valor:+val('f_valor')||0, valor_crianca:+val('f_valor_c')||0, valor_crianca_colo:+val('f_valor_cc')||0, observacoes:val('f_obs') };
  try{
    if(id){ await sb.from('aereos').update(row).eq('id',id); }
    else { await sb.from('aereos').insert(row); }
    await loadAll(); closeModal(); toast('Voo salvo'); render();
  }catch(e){ console.error(e); toast('Erro ao salvar: '+(e.message||'')); }
}

/* ============ PROPOSTAS ============ */
let propView = 'funil'; // 'funil' ou 'lista'
function setPropView(v){ propView=v; render(); }

// ===== Follow-up / lembretes =====
function hojeISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function followupStatus(p){
  if(!p.followupData) return null;
  const hoje=hojeISO();
  if(p.followupData < hoje) return 'atrasado';
  if(p.followupData === hoje) return 'hoje';
  return 'futuro';
}
function followupsPendentes(){
  // atrasados + hoje, ordenados por data; ignora propostas fechadas/perdidas
  return propostas
    .filter(p=>p.followupData && (p.status!=='fechado' && p.status!=='perdido'))
    .filter(p=>{ const s=followupStatus(p); return s==='atrasado'||s==='hoje'; })
    .sort((a,b)=>a.followupData.localeCompare(b.followupData));
}
function abrirFollowup(id){
  const p=propostas.find(x=>x.id===id); if(!p)return;
  const cl=clientes.find(x=>x.id===p.clienteId);
  openModal('Follow-up', `<p style="color:var(--n500);font-size:13px;margin-bottom:14px">${esc(cl?.nome||'')} · ${p.numero}</p>
    <div class="field"><label>Data do próximo retorno</label><input type="date" id="fu_data" value="${p.followupData||''}"></div>
    <div class="field"><label>Nota (o que fazer)</label><input id="fu_nota" placeholder="Ex: Ligar pra confirmar o pagamento" value="${esc(p.followupNota||'')}"></div>
    <div class="row-actions">
      ${p.followupData?`<button class="btn ghost" onclick="limparFollowup('${id}')" style="color:var(--danger)">Remover lembrete</button>`:''}
      <button class="btn ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn" onclick="salvarFollowup('${id}')">Salvar lembrete</button>
    </div>`);
}
async function salvarFollowup(id){
  const p=propostas.find(x=>x.id===id); if(!p)return;
  const data=val('fu_data'), nota=val('fu_nota');
  p.followupData=data; p.followupNota=nota;
  try{ await sb.from('propostas').update({followup_data:data||null, followup_nota:nota||null}).eq('id',id); closeModal(); toast('Lembrete salvo'); render(); }
  catch(e){ console.error(e); toast('Erro ao salvar'); }
}
async function limparFollowup(id){
  const p=propostas.find(x=>x.id===id); if(!p)return;
  p.followupData=''; p.followupNota='';
  try{ await sb.from('propostas').update({followup_data:null, followup_nota:null}).eq('id',id); closeModal(); toast('Lembrete removido'); render(); }
  catch(e){ console.error(e); toast('Erro'); }
}
function viewPropostas(){
  const head = `<div class="page-head"><div><h1>Propostas</h1><p>${propostas.length} no total</p></div>
    <div style="display:flex;gap:8px;align-items:center">
      <div style="display:flex;background:var(--n100);border-radius:10px;padding:3px">
        <button class="btn ${propView==='funil'?'':'ghost'} sm" onclick="setPropView('funil')" style="border-radius:8px">Funil</button>
        <button class="btn ${propView==='lista'?'':'ghost'} sm" onclick="setPropView('lista')" style="border-radius:8px">Lista</button>
      </div>
      <button class="btn" onclick="novaProposta()">+ Nova proposta</button>
    </div></div>`;

  return `<div class="funil-board" style="display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start">

        <div style="font-size:11px;color:var(--n500);margin:-6px 0 10px 18px">${soma>0?fmtMoeda(soma,'BRL'):'—'}</div>
        ${lista.map(p=>{ const cl=clientes.find(x=>x.id===p.clienteId); const d=destinos.find(x=>x.id===p.destinoId);

            <div style="font-weight:700;color:var(--ink);font-size:14px">${esc(cl?.nome||'—')}</div>
            <div style="font-size:12px;color:var(--n500);margin-top:2px">${esc(d?.nome||'Sem destino')} · ${p.numero}</div>
            <div class="mono" style="font-size:13px;color:var(--orange);font-weight:600;margin-top:6px">${fmtMoeda(p.valor,p.moeda)}</div>
            ${(()=>{ const s=followupStatus(p); if(!s) return ''; const cor=s==='atrasado'?'#c0392b':(s==='hoje'?'#E97324':'#64748b'); const txt=s==='atrasado'?'Atrasado':(s==='hoje'?'Hoje':fmtData(p.followupData)); return `<div style="font-size:11px;color:${cor};margin-top:4px;font-weight:600">🔔 ${txt}</div>`; })()}
            <div style="display:flex;gap:4px;margin-top:6px" onclick="event.stopPropagation()">
              <button class="btn ghost sm" onclick="abrirFollowup('${p.id}')" style="font-size:11px;padding:3px 8px">🔔 Lembrete</button>
            </div>

      </div>`;
    }).join('')}
  </div>
  <p style="font-size:12px;color:var(--n500);margin-top:8px">💡 Arraste os cartões entre as colunas pra mudar a etapa. Toque no cartão pra abrir a proposta.</p>`;
}
function listaPropostasHTML(){
  return `<div class="card pad">
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
      <input class="search" placeholder="Buscar por nº, cliente, consultor…" oninput="filtra(this,'.prop-row')" style="flex:1;min-width:200px">

// drag and drop do funil
let _dragId=null;
function dragCard(e,id){ _dragId=id; e.dataTransfer.effectAllowed='move'; }
async function dropCard(e,etapa){
  e.preventDefault();
  document.querySelectorAll('.funil-col').forEach(c=>c.classList.remove('drag-over'));
  if(!_dragId) return;
  const p=propostas.find(x=>x.id===_dragId); if(!p){ _dragId=null; return; }
  if(p.status===etapa){ _dragId=null; return; }
  const id=_dragId; _dragId=null;
  p.status=etapa; render();
  try{ await sb.from('propostas').update({status:etapa}).eq('id',id); toast('Movido para '+etapaInfo(etapa).label); }
  catch(err){ console.error(err); toast('Erro ao mover'); }
}
function filtraStatus(s){
  document.querySelectorAll('.prop-row').forEach(r=>{ r.style.display = (!s || r.dataset.status===s)?'':'none'; });
}
async function duplicarProposta(id){
  const p=propostas.find(x=>x.id===id); if(!p)return;
  if(!confirm('Criar uma cópia desta proposta ('+p.numero+')?'))return;
  const ano=new Date().getFullYear();
  let maior=0; propostas.forEach(x=>{ const m=(x.numero||'').match(new RegExp('TC-'+ano+'-(\\d+)')); if(m){ const n=parseInt(m[1],10); if(n>maior)maior=n; } });
  const numero='TC-'+ano+'-'+String(maior+1).padStart(3,'0');
  const row={ numero, cliente_id:p.clienteId, destino_id:p.destinoId, hotel_id:p.hotelId||null,

function noitesEntre(ci, co){ if(!ci||!co) return 0; const d=Math.round((new Date(co)-new Date(ci))/864e5); return d>0?d:0; }

function passaDestino(itemDestinoId, destinoSel, incluirSemDestino){
  if(!destinoSel) return true;            // sem destino escolhido: mostra todos
  if(!itemDestinoId) return incluirSemDestino; // item sem destino: mostra se permitido
  return itemDestinoId===destinoSel;
}

function somaProposta(){
  const itensExtra = Array.from(document.querySelectorAll('.ext-chk:checked')).map(c=>extras.find(z=>z.id===c.value)).filter(Boolean);
  const perAge = [...(_voosProp||[]), ...itensExtra]; // voos (na proposta) + extras: por pessoa, por faixa
  const qa=Math.max(0,+val('f_pax')||0), qc=Math.max(0,+val('f_pax_c')||0), qcc=Math.max(0,+val('f_pax_cc')||0);
  const totalPax=qa+qc+qcc;
  // itens por faixa
  let somaAd=0, somaC=0, somaCC=0;
  perAge.forEach(it=>{ somaAd+=(it.valor||0); somaC+=(it.valorCrianca||0); somaCC+=(it.valorCriancaColo||0); });
  let total = somaAd*qa + somaC*qc + somaCC*qcc;
  // hotéis: soma por QUARTO escolhido (qtd × diária × noites das datas). Valor do quarto não multiplica por pessoa.
  Array.from(document.querySelectorAll('.hot-chk:checked')).forEach(c=>{
    const ci=document.querySelector('.hot-checkin[data-hotel="'+c.value+'"]');
    const co=document.querySelector('.hot-checkout[data-hotel="'+c.value+'"]');
    const noites=noitesEntre(ci&&ci.value, co&&co.value);
    // atualiza o rótulo de noites ao vivo
    const lbl=document.querySelector('.hot-noites-label[data-hotel="'+c.value+'"]');
    if(lbl) lbl.textContent = noites>0? (noites+' noite(s)') : 'informe as datas';
    document.querySelectorAll('.hot-qtd[data-hotel="'+c.value+'"]').forEach(q=>{
      const qtd=Math.max(0,+q.value||0);
      const diaria=+q.dataset.diaria||0;
      total += qtd * diaria * noites;
    });
  });
  const el=document.getElementById('f_valor'); if(el) el.value=total.toFixed(2);
  calcPP();
}
// nº de dias da viagem a partir das datas do formulário
function diasViagem(){
  const a=val('f_ini'), b=val('f_fim');
  if(!a||!b) return 1;
  const d=Math.round((new Date(b)-new Date(a))/864e5);
  return d>0? d : 1;
}
function filtraHoteis(){ renderListasProposta(); }
function calcPP(){
  const v=+val('f_valor')||0, m=val('f_moeda')||'BRL';
  const qa=Math.max(0,+val('f_pax')||0), qc=Math.max(0,+val('f_pax_c')||0), qcc=Math.max(0,+val('f_pax_cc')||0);
  const totalPax=Math.max(1,qa+qc+qcc);
  const el=document.getElementById('f_pp'); if(el) el.value=fmtMoeda(v/totalPax,m)+' (média)';
}

  };
  const row={ numero:'TC-'+ano+'-'+seq, cliente_id:clienteId, destino_id:destinoId, hotel_id:(hoteisSel[0]?.hotel_id)||null, hoteis_sel:hoteisSel,
    extras_ids:extrasSel, aereos_ids:[], voos_prop:voosProp, data_inicio:val('f_ini')||null, data_fim:val('f_fim')||null, quantidade_passageiros:pax,
    qtd_adultos:qa, qtd_criancas:qc, qtd_criancas_colo:qcc,
    transporte:val('f_transp'), consultor, valor_total:valor, moeda, status:'lead_novo', conteudo_ia:conteudo };
  try{
    let resp = await sb.from('propostas').insert(row).select('*').single();
    if(resp.error){
      // número repetido? tenta de novo com um sufixo único
      row.numero = 'TC-'+ano+'-'+seq+'-'+Date.now().toString().slice(-4);
      resp = await sb.from('propostas').insert(row).select('*').single();
    }
    if(resp.error){ throw resp.error; }
    const data = resp.data;
    await loadAll(); closeModal(); toast('Proposta criada');
    currentPropostaId=data.id; page='proposta-ver'; render();
    popupMensagemWhats(data.id, true);
  }catch(e){ console.error(e); toast('Erro ao criar proposta: '+(e.message||e.code||'tente de novo')); }
}
// Mensagem calorosa (foco na experiência, sem valor) pra copiar e mandar no WhatsApp
function mensagemExperiencia(p){
  const cl=clientes.find(x=>x.id===p.clienteId);
  const d=destinos.find(x=>x.id===p.destinoId);
  const primeiroNome=(cl?.nome||'').trim().split(' ')[0]||'';
  const destino=d?.nome||'sua próxima viagem';
  return `Oi, ${primeiroNome}! 😍

Que alegria preparar essa viagem pra você!

Imagina só: ${destino} te esperando, cada detalhe pensado pra você só se preocupar em aproveitar e fazer memórias que vão durar a vida toda. ✨

Cuidamos de tudo — do roteiro ao suporte, do começo ao fim — pra que essa experiência seja leve, segura e inesquecível. 🌎

Preparei a proposta completa com todos os detalhes (tô te enviando aqui embaixo). Dá uma olhada com carinho e me conta o que achou — bora tirar esse sonho do papel? 💛

Equipe Todo Canto`;
}
function popupMensagemWhats(id, depoisDeCriar, antesDeImprimir){
  const p=propostas.find(x=>x.id===id); if(!p)return;
  const msg=mensagemExperiencia(p);
  let botoes;
  if(antesDeImprimir){
    botoes = `<button class="btn" onclick="copiarMensagemWhats()">📋 Copiar mensagem</button>
      <button class="btn ink" onclick="closeModal();setTimeout(()=>window.print(),200)">⎙ Imprimir agora →</button>`;
  } else if(depoisDeCriar){
    botoes = `<button class="btn" onclick="copiarMensagemWhats()">📋 Copiar mensagem</button>
      <button class="btn ghost" onclick="closeModal();editarTextos('${id}')">Continuar pra editar a proposta →</button>`;
  } else {
    botoes = `<button class="btn" onclick="copiarMensagemWhats()">📋 Copiar mensagem</button>
      <button class="btn ghost" onclick="closeModal()">Fechar</button>`;
  }
  openModal('Mensagem pro WhatsApp', `
    <p style="color:var(--n500);font-size:13px;margin-bottom:12px">Copie a mensagem abaixo, cole no WhatsApp do cliente e anexe o PDF da proposta. ✨</p>
    <div class="field"><textarea id="msg_whats" style="min-height:240px;font-size:14px;line-height:1.5">${esc(msg)}</textarea></div>
    <div class="row-actions" style="flex-wrap:wrap">${botoes}</div>`);
}
function imprimirComMensagem(id){ popupMensagemWhats(id, false, true); }
function copiarMensagemWhats(){
  const ta=document.getElementById('msg_whats'); if(!ta)return;
  ta.select(); ta.setSelectionRange(0,99999);
  try{
    navigator.clipboard.writeText(ta.value).then(()=>toast('Mensagem copiada! 📋')).catch(()=>{ document.execCommand('copy'); toast('Mensagem copiada! 📋'); });
  }catch(e){ document.execCommand('copy'); toast('Mensagem copiada! 📋'); }
}

function diasViagemProp(p){ if(!p.dataInicio||!p.dataFim) return 1; const d=Math.round((new Date(p.dataFim)-new Date(p.dataInicio))/864e5); return d>0?d:1; }
// Sugere os itens da memória de cálculo a partir dos voos e extras escolhidos.
function itensSugeridos(p){
  const out=[];
  const qa=p.qtdAdultos||0, qc=p.qtdCriancas||0, qcc=p.qtdCriancasColo||0;
  function expandir(nome, vAd, vC, vCC){
    if(qa>0 && vAd>0) out.push({desc:nome+' — '+qa+' adulto(s) × '+fmtMoeda(vAd,p.moeda), valor:vAd*qa, parcelas:1});
    if(qc>0 && vC>0)  out.push({desc:nome+' — '+qc+' criança(s) 2-11 × '+fmtMoeda(vC,p.moeda), valor:vC*qc, parcelas:1});
    if(qcc>0 && vCC>0) out.push({desc:nome+' — '+qcc+' colo × '+fmtMoeda(vCC,p.moeda), valor:vCC*qcc, parcelas:1});
  }
  (p.voosProp||[]).forEach(v=>{ expandir('Aéreo '+v.companhia, v.valor, v.valorCrianca, v.valorCriancaColo); });
  (p.aereosSel||[]).forEach(aid=>{ const a=aereos.find(z=>z.id===aid); if(a) expandir('Aéreo '+a.companhia, a.valor, a.valorCrianca, a.valorCriancaColo); });
  [...(p.hoteisSel||[])].sort((a,b)=>(a.checkin||'').localeCompare(b.checkin||'')).forEach(hs=>{
    const h=hoteis.find(x=>x.id===hs.hotel_id); if(!h) return;
    const noites=Math.max(1, (hs.checkin&&hs.checkout? noitesEntre(hs.checkin,hs.checkout) : 0) || hs.noites || 1);
    (hs.quartos||[]).forEach(q=>{
      if(q.qtd>0){
        const valorLinha=q.qtd*q.diaria*noites;
        out.push({desc:'Hospedagem '+h.nome+' — '+q.qtd+'x '+q.tipo+' ('+q.capacidade+'p) × '+noites+' noite(s) × '+fmtMoeda(q.diaria,p.moeda), valor:valorLinha, parcelas:1});
      }
    });
  });
  (p.extras||[]).forEach(eid=>{ const x=extras.find(z=>z.id===eid); if(x) expandir(x.nome, x.valor, x.valorCrianca, x.valorCriancaColo); });
  return out.length? out : [{desc:'',valor:0}];
}

// ===== Amortização: gera o cronograma mês a mês =====
// itens: [{desc, valor, parcelas}], dataIni: 'YYYY-MM-DD'
// Retorna { meses:[{n, data, total, partes:[{desc, valor}]}], maxParc }
function calcAmortizacao(itens, dataIniGeral){
  // cada item pode ter sua própria data de início (item.vencimento); senão usa a geral
  const validos = (itens||[]).filter(x=>x.valor>0 && (x.vencimento||dataIniGeral));
  if(!validos.length) return null;
  // gera, pra cada item, a lista de (mês-chave, valor da parcela)
  function chave(d){ return d.getFullYear()*12 + d.getMonth(); } // índice absoluto de mês
  const mapa = {}; // chave -> { data, total, partes:[] }
  let minK=Infinity, maxK=-Infinity;
  validos.forEach(x=>{
    const ini = (x.vencimento||dataIniGeral);
    const [Y,M,D] = ini.split('-').map(Number);
    const np = x.parcelas||1;
    const v = x.valor/np;
    for(let i=0;i<np;i++){
      const d = new Date(Y, M-1+i, D);
      const k = chave(d);
      if(!mapa[k]) mapa[k] = { data:d, total:0, partes:[] };
      mapa[k].total += v;
      const ja = mapa[k].partes.find(pp=>pp.desc===x.desc);
      if(ja) ja.valor += v; else mapa[k].partes.push({desc:x.desc, valor:v});
      if(k<minK)minK=k; if(k>maxK)maxK=k;
    }
  });
  // monta a lista ordenada de meses (incluindo meses vazios no intervalo)
  const meses = [];
  let n=1;
  for(let k=minK;k<=maxK;k++){
    if(mapa[k]){ meses.push({ n:n++, data:mapa[k].data, total:mapa[k].total, partes:mapa[k].partes }); }
    else { const y=Math.floor(k/12), mo=k%12; meses.push({ n:n++, data:new Date(y,mo,1), total:0, partes:[] }); }
  }
  return { meses, maxParc:meses.length, itens:validos };
}
function fmtDataObj(d){ const dd=String(d.getDate()).padStart(2,'0'), mm=String(d.getMonth()+1).padStart(2,'0'); return dd+'/'+mm+'/'+d.getFullYear(); }
const DIAS_SEMANA = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];

// Tabela de amortização em HTML (usada na prévia e no PDF)
function amortizacaoHTML(itens, dataIni, moeda){
  const r = calcAmortizacao(itens, dataIni);
  if(!r) return '';
  const totalGeral = r.meses.reduce((s,mes)=>s+mes.total,0);
  // Lista de vencimentos: cada parcela é um bloco (não corta, desce na vertical)
  let h = `<div style="display:flex;flex-direction:column;gap:8px">`;
  r.meses.forEach(mes=>{
    if(mes.total<=0) return; // pula meses sem nada a pagar
    h += `<div style="border:1px solid var(--n200);border-radius:10px;padding:10px 12px;break-inside:avoid">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--n100);padding-bottom:6px;margin-bottom:6px">
        <div style="font-weight:700;color:var(--ink)">${mes.n}ª parcela · ${fmtDataObj(mes.data)} <span style="font-weight:400;color:var(--n500);font-size:12px">(${DIAS_SEMANA[mes.data.getDay()]})</span></div>
        <div class="mono" style="font-weight:700;color:var(--orange);white-space:nowrap">${fmtMoeda(mes.total,moeda)}</div>
      </div>
      <div style="font-size:12px;color:var(--n600);line-height:1.7">
        ${mes.partes.filter(p=>p.valor>0).map(p=>`<span style="display:inline-block;margin-right:14px;white-space:nowrap">${esc(p.desc.split(' — ')[0])}: <b class="mono" style="color:var(--n700)">${fmtMoeda(p.valor,moeda)}</b></span>`).join('')}
      </div>
    </div>`;
  });
  h += `<div style="display:flex;justify-content:space-between;align-items:center;border-top:2px solid var(--n300);padding-top:10px;margin-top:2px">
    <div style="font-weight:700;color:var(--ink)">Total geral</div>
    <div class="mono" style="font-weight:700;color:var(--ink);font-size:16px">${fmtMoeda(totalGeral,moeda)}</div>
  </div>`;
  h += `</div>`;
  return h;
}

// Refaz a memória de cálculo com os valores atuais de hotel/voos/extras
function recalcularMemoria(id){
  const p=propostas.find(x=>x.id===id); if(!p)return;
  if(!confirm('Refazer a memória de cálculo com os valores atuais? Isso substitui as linhas atuais (e ajustes manuais que você tenha feito).'))return;
  const itens=itensSugeridos(p);
  const box=document.getElementById('memoria');
  if(box){ box.innerHTML = itens.map((it,i)=>linhaMemoria(it,i)).join(''); recalcMemoria(); toast('Memória recalculada'); }
}
// ---- Memória de cálculo ----
function linhaMemoria(it,i){
  return `<div class="mem-linha" style="display:flex;gap:6px;margin-bottom:6px;align-items:center;flex-wrap:wrap">
    <input class="mem-desc" placeholder="Ex: Passagem, Hospedagem…" value="${esc(it.desc||'')}" style="flex:1;min-width:140px;height:36px;border:1.5px solid var(--n300);border-radius:8px;padding:0 10px">
    <input class="mem-val" type="number" min="0" step="0.01" placeholder="Valor total" value="${it.valor||0}" oninput="recalcMemoria()" title="Valor total do item" style="width:100px;height:36px;border:1.5px solid var(--n300);border-radius:8px;padding:0 8px;text-align:right">
    <input class="mem-parc" type="number" min="1" step="1" placeholder="x" value="${it.parcelas||1}" oninput="recalcMemoria()" title="Nº de parcelas" style="width:48px;height:36px;border:1.5px solid var(--n300);border-radius:8px;padding:0 8px;text-align:center">
    <input class="mem-venc" type="date" value="${it.vencimento||''}" oninput="recalcMemoria()" title="1º vencimento deste item" style="width:140px;height:36px;border:1.5px solid var(--n300);border-radius:8px;padding:0 6px">
    <button type="button" onclick="this.parentElement.remove();recalcMemoria()" style="border:none;background:none;color:var(--danger);font-size:18px;cursor:pointer">×</button>
  </div>`;
}
function addLinhaMemoria(){
  const box=document.getElementById('memoria');
  const div=document.createElement('div'); div.innerHTML=linhaMemoria({desc:'',valor:0,parcelas:1},0);
  box.appendChild(div.firstChild); recalcMemoria();
}
function lerMemoria(){
  const vencGeral=val('t_venc');
  return Array.from(document.querySelectorAll('.mem-linha')).map(l=>({
    desc:l.querySelector('.mem-desc').value.trim(),
    valor:+l.querySelector('.mem-val').value||0,
    parcelas:Math.max(1,+l.querySelector('.mem-parc').value||1),
    vencimento:l.querySelector('.mem-venc').value || vencGeral || ''
  })).filter(x=>x.desc||x.valor);
}
function recalcMemoria(){
  const itens=lerMemoria();
  const total=itens.reduce((s,x)=>s+x.valor,0); // cada linha já é total
  const moeda=val('t_moeda')||'BRL';
  const p=propostas.find(x=>x.id===currentPropostaId);
  const totalPax=Math.max(1,(p?.qtdAdultos||0)+(p?.qtdCriancas||0)+(p?.qtdCriancasColo||0));
  const mt=document.getElementById('memTotal'), mp=document.getElementById('memPP');
  if(mt)mt.textContent=fmtMoeda(total,moeda);
  if(mp)mp.textContent=fmtMoeda(total/totalPax,moeda);
  // prévia do parcelamento
  const prev=document.getElementById('amortPreview');
  if(prev){ const venc=val('t_venc'); prev.innerHTML = venc? `<div style="font-size:11px;color:var(--n500);margin-bottom:4px">Prévia do parcelamento:</div><div style="overflow-x:auto">${amortizacaoHTML(itens,venc,moeda)}</div>` : '<div style="font-size:12px;color:var(--n500)">Informe o 1º vencimento para ver o parcelamento.</div>'; }
}

// Abre o WhatsApp com um resumo da proposta pronto para enviar.
function enviarWhats(id){
  const p=propostas.find(x=>x.id===id); if(!p)return;
  const cl=clientes.find(x=>x.id===p.clienteId), d=destinos.find(x=>x.id===p.destinoId);
  const c=p.conteudo||{};
  let msg = `*Todo Canto Turismo* ✈️\n\n`;
  msg += `*${c.capa?.titulo || d?.nome || 'Proposta de viagem'}*\n`;
  if(p.dataInicio||p.dataFim) msg += `${periodo(p.dataInicio,p.dataFim)}\n`;
  msg += `Proposta ${p.numero}\n\n`;
  if(c.apresentacao) msg += `${c.apresentacao}\n\n`;
  if(p.aereosSel&&p.aereosSel.length){ msg+=`*Aéreo:*\n`; p.aereosSel.forEach(aid=>{const a=aereos.find(z=>z.id===aid); if(a) msg+=`✈ ${a.companhia} ${a.origem||''}→${a.destino||''}\n`;}); msg+=`\n`; }
  if(c.itens&&c.itens.length){ msg += `*Investimento:*\n`; c.itens.forEach(it=>{ msg+=`• ${it.desc}: ${fmtMoeda(it.valor,p.moeda)}\n`; }); }
  msg += `\n*Total:* ${fmtMoeda(p.valor,p.moeda)}\n`;
  msg += `${composicaoPax(p)}`;
  if(c.investimento_condicao) msg += `\n${c.investimento_condicao}`;
  msg += `\n`;
  if(c.mensagem_final) msg += `\n${c.mensagem_final}\n`;
  msg += `\n_${config.instagram} · ${config.whatsapp}_`;

  // tenta usar o telefone do cliente, se houver
  let fone = (cl?.telefone||'').replace(/\D/g,'');
  if(fone && fone.length>=10 && !fone.startsWith('55')) fone='55'+fone;
  const base = fone ? `https://wa.me/${fone}` : `https://wa.me/`;
  window.open(`${base}?text=${encodeURIComponent(msg)}`,'_blank');
  toast('Abrindo WhatsApp… anexe o PDF se quiser enviá-lo junto');
}


// Renderiza os trechos (pernas) de um voo, mostrando conexões e horários.
function voosTrechosHTML(rotulo, trechos){
  if(!trechos || !trechos.length) return '';
  const cor = rotulo==='Ida' ? 'var(--blue)' : 'var(--orange)';
  let out = `<div style="margin:4px 0 6px"><span style="font-size:11px;font-weight:700;color:${cor}">${rotulo}</span></div>`;
  trechos.forEach((t,i)=>{
    const conexao = i>0;
    out += `<div style="display:flex;gap:10px;margin-bottom:6px;padding-left:6px;border-left:2px solid ${cor}">
      <div style="flex:1">
        <div style="font-size:13px;color:var(--ink)"><b>${esc(t.origem||'?')}</b> → <b>${esc(t.destino||'?')}</b>${t.voo?` <span style="color:var(--n500);font-size:12px">(voo ${esc(t.voo)})</span>`:''}${conexao?' <span style="font-size:10px;color:var(--warn)">• conexão</span>':''}</div>
        <div style="font-size:12px;color:var(--n500)">Partida: ${t.partidaData?fmtData(t.partidaData):''} ${esc(t.partidaHora||'')} · Chegada: ${t.chegadaData?fmtData(t.chegadaData):''} ${esc(t.chegadaHora||'')}</div>
      </div>
    </div>`;
  });
  return out;
}

// ===== Backup: baixa um arquivo .json com todos os dados =====
function exportarBackup(){
  const dados = { exportadoEm:new Date().toISOString(), clientes, destinos, hoteis, aereos, extras, propostas };
  const blob = new Blob([JSON.stringify(dados,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const hoje = new Date().toISOString().slice(0,10);
  a.href=url; a.download='backup-todocanto-'+hoje+'.json'; a.click();
  URL.revokeObjectURL(url);
  toast('Backup baixado');
}


// Valor por pessoa em destaque (média do grupo): total ÷ nº de pessoas
function valorPorPessoa(p){
  const totalPax=Math.max(1,(p.qtdAdultos||0)+(p.qtdCriancas||0)+(p.qtdCriancasColo||0));
  return p.valor/totalPax;
}
// Texto da composição de passageiros (adultos/crianças)
function composicaoPax(p){
  const parts=[];
  if(p.qtdAdultos) parts.push(p.qtdAdultos+' adulto(s)');
  if(p.qtdCriancas) parts.push(p.qtdCriancas+' criança(s) 2-11');
  if(p.qtdCriancasColo) parts.push(p.qtdCriancasColo+' criança(s) de colo (0-2)');
  return parts.length? parts.join(' · ') : (p.pax+' passageiro(s)');
}
/* ============ HELPERS ============ */
function val(id){ const el=document.getElementById(id); return el? el.value.trim() : ''; }
function ultimoConsultor(){ return localStorage.getItem('tcp_ultimoConsultor') || ''; }
function nl2br(s){ return esc(s||'').replace(/\n/g,'<br>'); }
function linhas(s){ return (s||'').split('\n').map(x=>x.trim()).filter(Boolean); }
async function del(tipo,id){
  let aviso='Excluir este registro? Esta ação não pode ser desfeita.';
  if(tipo==='propostas'){
    const p=propostas.find(x=>x.id===id);
    if(p){ const cl=clientes.find(c=>c.id===p.clienteId);
      aviso='Excluir a proposta '+p.numero+(cl?(' de '+cl.nome):'')+(p.consultor?(' (consultor: '+p.consultor+')'):'')+'?\n\nEsta ação não pode ser desfeita e afeta toda a equipe.'; }
  }
  if(!confirm(aviso))return;
  try{ await sb.from(tipo).delete().eq('id',id); await loadAll(); toast('Excluído'); render(); }
  catch(e){ console.error(e); toast('Erro ao excluir'); }
}
function filtra(input,sel){
  const t=input.value.toLowerCase();
  document.querySelectorAll(sel).forEach(r=>{ r.style.display = r.dataset.s.includes(t)?'':'none'; });
}
function empty(t,d,btn,fn){ return `<div class="empty"><h3>${t}</h3><p>${d}</p><button class="btn" onclick="${fn}">${btn}</button></div>`; }

// ===== Trava de senha da equipe =====
const SENHA_EQUIPE = 'piroca';
document.getElementById('gateLogo').src = LOGO_TC;
// lista de aeroportos para autocompletar (origem/destino dos voos)
(function(){ const dl=document.createElement('datalist'); dl.id='listaAeroportos'; dl.innerHTML=AEROPORTOS.map(a=>'<option value="'+a+'"></option>').join(''); document.body.appendChild(dl); })();
function iniciarApp(){
  document.getElementById('brandLogo').src = LOGO_TC;
  document.getElementById('content').innerHTML = '<div style="padding:60px;text-align:center;color:var(--n500)">Carregando dados da equipe…</div>';
  loadAll().then(()=>render()).catch(e=>{ console.error(e); document.getElementById('content').innerHTML='<div style=\'padding:40px;color:var(--danger)\'>Erro ao conectar no banco. Recarregue a página.</div>'; });
}
function tentarEntrar(){
  const v=(document.getElementById('senhaInput').value||'').trim();
  if(v===SENHA_EQUIPE){
    sessionStorage.setItem('tcp_ok','1');
    document.getElementById('gate').style.display='none';
    iniciarApp();
  } else {
    const err=document.getElementById('senhaErro'); if(err) err.style.display='block';
    document.getElementById('senhaInput').value='';
  }
}
// já passou a senha nesta sessão? entra direto
if(sessionStorage.getItem('tcp_ok')==='1'){
  document.getElementById('gate').style.display='none';
  iniciarApp();
} else {
  const inp=document.getElementById('senhaInput');
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') tentarEntrar(); });
  inp.focus();
}
